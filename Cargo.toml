[workspace]
resolver = "2"
members = [
    "conformance",
    "crates/proof-agent-runtime",
    "crates/proof-kernel",
    "crates/proof-operator-auth",
    "crates/proof-operator-control",
    "crates/proof-observability",
    "crates/proof-content",
    "crates/proof-commerce",
    "crates/proof-workflow",
    "crates/proof-analytics",
    "crates/proof-storage",
    "crates/proof-transport-http",
    "crates/proof-transport-ws",
    "crates/proof-transport-mcp",
    "crates/proof-transport-cli",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = "=1.9.0"
rustix = { version = "=1.1.4", features = ["fs", "process", "termios"] }

[workspace.package]
edition = "2021"
license = "MIT"
