[package]
name = "proof-transport-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "proof"
path = "src/main.rs"

[dependencies]
proof-agent-runtime = { path = "../proof-agent-runtime" }
proof-kernel = { path = "../proof-kernel" }
proof-content = { path = "../proof-content" }
proof-commerce = { path = "../proof-commerce" }
proof-workflow = { path = "../proof-workflow" }
proof-analytics = { path = "../proof-analytics" }
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
rand.workspace = true
anyhow = "1"
chrono.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
proof-storage = { path = "../proof-storage" }
rusqlite.workspace = true
tar = "0.4"
flate2 = "1"
hex = "0.4"
rustix = { version = "=1.1.4", features = ["termios"] }

[dev-dependencies]
assert_fs = "1.1.4"
predicates = "3.1.4"
tower = { version = "0.5", features = ["util"] }
